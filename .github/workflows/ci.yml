# The gates every change to main must pass. Needs no secrets: the app's tests run on
# in-memory PGlite, and the build runs with an empty environment (no DATABASE_URL, no
# NEAR or Privy keys), as it does here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  web:
    name: Typecheck, lint, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version comes from "packageManager" in package.json (pnpm 10.19.0).
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Runs `next typegen` before tsc in apps/wgp.
      - run: pnpm -r typecheck

      - run: pnpm -r lint

      # Every claim in the README and docs still points at real code and real tests, and
      # docs/EVIDENCE.md is up to date with docs/evidence.json. No tests run here (seconds).
      - run: pnpm evidence --check

      - run: pnpm -r --workspace-concurrency=1 test

      - run: pnpm --filter wgp build

  contract:
    name: Contract tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: contracts/wgp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the toolchain contracts/wgp/rust-toolchain.toml pins (1.95.0).
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: contracts/wgp -> target

      - run: cargo test --locked

  # The built wasm in a local NEAR sandbox (near-workspaces): deploy, mint, craft and transfer,
  # the market, an upgrade from v1, and the NPC trader's calls from an ordinary account.
  # `pnpm evidence` does not run these (they need cargo-near and a built wasm); this job does.
  sandbox:
    name: Contract sandbox tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: contracts/wgp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the toolchain contracts/wgp/rust-toolchain.toml pins (1.95.0), with wasm32.
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            contracts/wgp -> target
            contracts/wgp/sandbox -> target

      # cargo-near 0.22.0, the version the deployed wasm was built with, from its release binary.
      - run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-installer.sh | sh

      - run: cargo near build non-reproducible-wasm --locked

      # One at a time: each test starts its own sandbox node.
      - run: cargo test --locked -- --test-threads=1
        working-directory: contracts/wgp/sandbox

  # Runs every claim's proof: the three test suites once each, mapped back to the claims in
  # docs/evidence.json, and the test counts the README quotes. No network and no secrets.
  evidence:
    name: Evidence for every claim
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The "plan before code" claim reads commit order, so it needs the history.
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # Installs the toolchain contracts/wgp/rust-toolchain.toml pins (1.95.0).
      - run: rustup toolchain install
        working-directory: contracts/wgp

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: contracts/wgp -> target

      - run: pnpm install --frozen-lockfile

      - run: pnpm evidence
