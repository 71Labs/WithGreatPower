[package]
name = "wgp-sandbox"
description = "Spike S5: near-workspaces sandbox tests for contracts/wgp. Run `cargo near build non-reproducible-wasm` in ../ first."
version = "0.0.0"
edition = "2021"
publish = false

[dev-dependencies]
near-workspaces = "0.24"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
anyhow = "1"
